<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Happy Jump Helper</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <h1>Happy jump</h1>
    <p class="sub" id="who">Loading…</p>
    <div class="top-actions">
      <button id="refresh" class="icon-btn" title="Refresh from Torn API" aria-label="Refresh">↻</button>
      <button id="openSettings" class="icon-btn" title="Settings" aria-label="Settings">⚙</button>
    </div>
  </header>

  <div id="error" class="error" hidden></div>

  <main id="main" hidden>
    <section class="phase" id="phase">
      <h2 id="phaseTitle"></h2>
      <p id="phaseDetail"></p>
      <p class="tick" id="tickLine">Next quarter tick in <strong id="tick">–</strong></p>
      <div class="phase-actions" id="phaseActions"></div>
    </section>

    <section class="card">
      <div class="meter">
        <div class="meter-head"><span>Happy</span><span id="happyVal"></span></div>
        <div class="bar happy"><i id="happyBar"></i><b id="happyMax" title="Your maximum happy"></b></div>
      </div>
      <div class="meter">
        <div class="meter-head"><span>Energy stack</span><span id="energyVal"></span></div>
        <div class="bar energy"><i id="energyBar"></i></div>
      </div>
      <p class="cds">Drug <b id="drugCd"></b> · Booster <b id="boosterCd"></b> · Refill <b id="refill"></b></p>
    </section>

    <section class="card">
      <table class="items">
        <thead><tr><th>Your jump with what you have</th><th>Use</th><th>Own</th><th></th></tr></thead>
        <tbody id="itemRows"></tbody>
      </table>
      <p class="note warn" id="invNote" hidden></p>
      <dl class="cells">
        <div><dt>Happy</dt><dd class="pink" id="planHappy"></dd></div>
        <div><dt>Energy</dt><dd class="amber" id="planEnergy"></dd></div>
        <div><dt>Train</dt><dd id="planStat"></dd></div>
        <div><dt>Est. gain</dt><dd id="planGain"></dd></div>
      </dl>
      <p class="note" id="planNote"></p>
    </section>

    <section class="card risk" id="risk">
      <p class="cds">Addiction <b id="addPct">–</b> · Safe Xanax <b id="safeXan">–</b> · OD risk <b id="odStack">–</b></p>
      <p class="note" id="riskMsg"></p>
    </section>

    <footer class="controls">
      <button id="pause" class="text-btn"></button>
      <button id="resetSkips" class="text-btn" hidden>Undo "proceed without"</button>
    </footer>
  </main>
  <script src="lib/log.js"></script>
  <script src="lib/calc.js"></script>
  <script src="lib/plan.js"></script>
  <script src="popup.js"></script>
</body>
</html>
